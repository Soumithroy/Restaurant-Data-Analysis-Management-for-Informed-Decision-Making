name: SQL & analytics CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start MySQL 8
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=restaurant \
            mysql:8.0 --lower-case-table-names=1 --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
          for i in $(seq 1 60); do docker exec mysql mysqladmin ping -h 127.0.0.1 -proot --silent && break; sleep 2; done
          sleep 5

      - name: Create schema, load data, add indexes, create users
        run: |
          docker exec -i mysql mysql -uroot -proot restaurant < "SQL Files/Table creation and inserting value.sql"
          docker exec -i mysql mysql -uroot -proot restaurant < "SQL Files/indexes_and_optimization.sql"
          docker exec -i mysql mysql -uroot -proot < "SQL Files/user_access_control.sql"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r analysis/requirements.txt pytest

      - name: Run every query (original + KPI)
        working-directory: analysis
        run: pytest -q test_queries.py

      - name: Generate analytics report
        run: python analysis/analyze.py

      - uses: actions/upload-artifact@v4
        with:
          name: analytics-report
          path: reports/
